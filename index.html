<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1026" />
  <title>لا داعي للقلق — سنعود قريبًا</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

    :root {
      --bg: #080b1c;
      --text: #f8f9ff;
      --muted: #b7bdd9;
      --cyan: #55e7ff;
      --purple: #9d6bff;
      --pink: #ff66bd;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; width: 100%; max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      color: var(--text);
      font-family: 'Cairo', system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 15%, rgba(157,107,255,.22), transparent 30%),
        radial-gradient(circle at 82% 75%, rgba(85,231,255,.14), transparent 32%),
        var(--bg);
    }

    .scene {
      position: relative;
      width: 100%;
      max-width: 100vw;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      padding: clamp(16px, 4vw, 40px);
    }

    .grid {
      position: absolute;
      inset: -20%;
      z-index: -3;
      opacity: .25;
      background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 54px 54px;
      transform: perspective(500px) rotateX(58deg) scale(1.7) translateY(20%);
      animation: gridMove 12s linear infinite;
    }

    .orb {
      position: absolute;
      z-index: -2;
      width: min(48vw, 520px);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(4px);
      opacity: .32;
      mix-blend-mode: screen;
      animation: drift 10s ease-in-out infinite alternate;
    }
    .orb.one { top: -16%; left: -10%; background: var(--purple); }
    .orb.two { right: -14%; bottom: -20%; background: var(--cyan); animation-delay: -4s; }

    .stars, .stars::before, .stars::after {
      position: absolute;
      inset: 0;
      content: '';
      z-index: -1;
      background-image: radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1.5px);
      background-size: 130px 130px;
      animation: stars 18s linear infinite;
      opacity: .28;
    }
    .stars::before { background-size: 190px 190px; animation-duration: 28s; opacity: .18; }
    .stars::after { background-size: 73px 73px; animation-duration: 12s; opacity: .12; }

    .card {
      position: relative;
      width: min(780px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);
      margin-inline: auto;
      padding: clamp(36px, 7vw, 78px) clamp(24px, 7vw, 82px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 32px;
      background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.045));
      box-shadow: 0 26px 80px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: cardFloat 6s ease-in-out infinite;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(120deg, transparent 15%, rgba(85,231,255,.9), transparent 45%, rgba(255,102,189,.8), transparent 75%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: borderGlow 5s linear infinite;
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      color: #dffbff;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(85,231,255,.28);
      border-radius: 100px;
      background: rgba(85,231,255,.1);
      box-shadow: 0 0 25px rgba(85,231,255,.12);
    }
    .badge::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      animation: pulse 1.5s ease-in-out infinite;
    }

    h1 {
      margin: 25px 0 10px;
      max-width: 100%;
      overflow-wrap: break-word;
      font-size: clamp(36px, 7vw, 74px);
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -1.5px;
      background: linear-gradient(100deg, #fff 10%, var(--cyan) 48%, #e0b7ff 85%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleShine 4s ease-in-out infinite;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 580px;
      overflow-wrap: break-word;
      color: var(--muted);
      font-size: clamp(16px, 2.4vw, 21px);
      line-height: 2;
    }

    .loader {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin: 31px 0 23px;
    }
    .loader span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 17px var(--cyan);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .loader span:nth-child(2) { animation-delay: .16s; background: var(--purple); box-shadow: 0 0 17px var(--purple); }
    .loader span:nth-child(3) { animation-delay: .32s; background: var(--pink); box-shadow: 0 0 17px var(--pink); }

    .footer { color: rgba(255,255,255,.5); font-size: 13px; }
    .footer span { color: var(--cyan); }

    /* شاشات التابلت والموبايل */
    @media (max-width: 640px) {
      .scene { padding: 18px 14px; }
      .card {
        width: calc(100vw - 28px);
        max-width: calc(100vw - 28px);
        padding: clamp(30px, 7vw, 48px) clamp(18px, 6vw, 32px);
        border-radius: 24px;
      }
      .badge {
        max-width: 100%;
        padding: 7px 12px;
        font-size: 11px;
      }
      h1 {
        margin-top: 20px;
        font-size: clamp(30px, 11vw, 50px);
        letter-spacing: -.8px;
      }
      .subtitle {
        max-width: 31rem;
        font-size: clamp(13px, 4vw, 17px);
        line-height: 1.8;
      }
      .loader { margin: 25px 0 19px; }
      .orb { width: min(70vw, 360px); }
    }

    /* الهواتف الصغيرة جدًا */
    @media (max-width: 380px) {
      .scene { padding: 12px 10px; }
      .card { padding: 26px 15px; }
      .badge { font-size: 10px; }
      h1 { font-size: 31px; }
      .subtitle { font-size: 12px; line-height: 1.75; }
      .footer { font-size: 11px; }
    }

    /* الموبايل بالعرض أو الشاشات القصيرة: لا نسمح بقص المحتوى */
    @media (max-height: 560px) and (orientation: landscape) {
      .scene { padding: 18px; place-items: center; }
      .card { margin: 10px 0; padding: 24px 32px; }
      h1 { margin: 12px 0 6px; font-size: clamp(30px, 7vw, 50px); }
      .subtitle { font-size: 14px; line-height: 1.55; }
      .loader { margin: 15px 0 12px; }
    }

    @keyframes gridMove { to { transform: perspective(500px) rotateX(58deg) scale(1.7) translateY(24%); } }
    @keyframes drift { from { transform: translate3d(-25px, -15px, 0) scale(.9); } to { transform: translate3d(35px, 35px, 0) scale(1.12); } }
    @keyframes stars { to { transform: translateY(130px); } }
    @keyframes cardFloat { 0%,100% { transform: translateY(0) rotateX(0deg); } 50% { transform: translateY(-10px) rotateX(1deg); } }
    @keyframes borderGlow { to { transform: rotate(360deg); } }
    @keyframes titleShine { 0%,100% { filter: drop-shadow(0 0 0 transparent); } 50% { filter: drop-shadow(0 0 20px rgba(85,231,255,.25)); } }
    @keyframes pulse { 50% { transform: scale(1.45); opacity: .55; } }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-12px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="grid" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"></div>
    <div class="orb one" aria-hidden="true"></div>
    <div class="orb two" aria-hidden="true"></div>

    <section class="card" aria-labelledby="title">
      <div class="badge">نعمل على تطوير تجربة استثنائية</div>
      <h1 id="title">لا داعي للقلق</h1>
      <p class="subtitle">الموقع قيد التطوير حاليًا.<br>سنعود قريبًا.</p>
      <div class="loader" aria-label="جاري التطوير"><span></span><span></span><span></span></div>
      <div class="footer">شكرًا لصبركم <span>و</span> ثقتكم</div>
    </section>
  </main>
</body>
</html>
